<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">Vue 可定制工作台结构示意</title><desc id="desc">左侧图表、右侧市场和交易，下方订单与仓位标签。支持跨组移动、边缘拆分及调整分隔条。</desc><rect width="1120" height="520" rx="18" fill="#111518"/><g font-family="Arial, sans-serif"><text x="28" y="43" fill="#edf4f6" font-size="23" font-weight="bold">WORKSPACE / Vue 3 + Dockview</text><text x="28" y="71" fill="#8e9ca5" font-size="14">结构示意 · 自行绘制 · 无真实账户或行情</text><g stroke="#46545d" fill="#1a2126"><rect x="28" y="93" width="625" height="245" rx="7"/><rect x="665" y="93" width="208" height="245" rx="7"/><rect x="885" y="93" width="207" height="340" rx="7"/><rect x="28" y="350" width="845" height="83" rx="7"/></g><g font-size="15" fill="#dfe8ed"><text x="46" y="121">图表</text><text x="620" y="121">＋</text><text x="683" y="121">市场 ｜ 盘口</text><text x="845" y="121">＋</text><text x="904" y="121">交易</text><text x="1063" y="121">＋</text><text x="46" y="377">当前委托　｜　当前仓位　｜　自定义笔记</text><text x="845" y="377">＋</text></g><g stroke="#34424a"><path d="M29 136H652 M666 136H872 M886 136H1091 M29 391H872"/><path d="M47 175H632 M47 220H632 M47 265H632 M47 310H632"/></g><path d="M47 291L95 270L137 280L182 242L224 252L268 202L311 221L357 182L405 211L452 169L498 186L546 151L590 169L632 145" stroke="#54d8a3" fill="none" stroke-width="3"/><g fill="#8e9ca5" font-size="14"><text x="683" y="171">可替换的业务组件</text><text x="683" y="205">每个组容纳多个 tab</text><text x="904" y="171">模拟内容</text><text x="904" y="202">无账户连接</text><text x="904" y="233">无下单功能</text><text x="46" y="418">同类组件可创建多个独立实例；每个实例有自己的参数与标题</text></g><path d="M659 157V312" stroke="#82b3f4" stroke-width="4"/><g font-size="16"><text x="29" y="472" fill="#82b3f4">① 拖分隔条调尺寸</text><text x="340" y="472" fill="#54d8a3">② 拖标签到中心合并</text><text x="700" y="472" fill="#ffcf77">③ 拖到边缘拆分</text></g></g></svg>
